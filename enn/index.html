<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ennnnn... güzel kızsın 💖</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💖</text></svg>">
  <style>
    :root {
      color-scheme: light;
      --rose: #ef5d8f;
      --berry: #b73872;
      --plum: #6d3f7c;
      --mint: #2fa99b;
      --paper: rgba(255, 255, 255, 0.9);
      --paper-strong: rgba(255, 255, 255, 0.95);
      --shadow: rgba(129, 47, 90, 0.18);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        linear-gradient(145deg, #fff9f0 0%, #ffe1ec 36%, #d8f5ef 70%, #ede8ff 100%);
      color: var(--plum);
      overflow-x: hidden;
      font-family: ui-rounded, "SF Pro Rounded", "Trebuchet MS", system-ui, sans-serif;
      min-height: 100vh;
      -webkit-overflow-scrolling: touch;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0));
    }

    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      position: sticky;
      top: 0;
      padding: 28px 18px 122px;
      z-index: 2;
    }

    #text-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(720px, calc(100vw - 36px));
      min-height: 220px;
      padding: 46px 50px;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid rgba(255, 255, 255, 0.96);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 246, 251, 0.92), rgba(255, 255, 255, 0.9) 45%, rgba(241, 253, 250, 0.88)),
        var(--paper);
      box-shadow:
        0 24px 64px var(--shadow),
        0 0 0 10px rgba(255, 255, 255, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
    }

    #text-wrapper::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: linear-gradient(90deg, #ffd166, #ff9ec2, #c9a3ff, #8fe3d8, #ffd166);
      z-index: 0;
    }

    #text-wrapper::after {
      content: '♡ ♡';
      position: absolute;
      right: 16px;
      bottom: 12px;
      color: rgba(239, 93, 143, 0.26);
      font-size: 34px;
      font-weight: 800;
      line-height: 1;
      pointer-events: none;
      z-index: 0;
    }

    #text {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 100%;
      color: var(--berry);
      font-size: 58px;
      font-weight: 900;
      line-height: 1.22;
      text-align: left;
      letter-spacing: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
      text-shadow:
        0 2px 0 #ffffff,
        0 16px 38px rgba(183, 56, 114, 0.22);
    }

    #ending-wrapper {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: min(520px, calc(100vw - 32px));
      padding: 16px 22px;
      border: 1px solid rgba(255, 255, 255, 0.92);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 244, 249, 0.96), rgba(255, 255, 255, 0.95)),
        var(--paper-strong);
      box-shadow:
        0 16px 44px rgba(129, 47, 90, 0.16),
        0 0 0 8px rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(14px);
      z-index: 10;
    }

    #ending-wrapper::before,
    #ending-wrapper::after {
      content: '♡';
      color: rgba(239, 93, 143, 0.36);
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
    }

    #ending {
      margin: 0;
      color: var(--berry);
      font-size: 30px;
      font-weight: 850;
      line-height: 1.12;
      text-align: center;
    }

    #ending-heart {
      color: var(--rose);
      font-size: 30px;
      line-height: 1;
    }

    .heart,
    .star {
      position: fixed;
      pointer-events: none;
      user-select: none;
      z-index: 1;
      filter: drop-shadow(0 10px 16px rgba(129, 47, 90, 0.14));
    }

    .heart {
      font-size: 30px;
      opacity: 0.64;
    }

    .floaty-1 {
      left: 10%;
      top: 20%;
    }

    .floaty-2 {
      right: 15%;
      top: 38%;
    }

    .floaty-3 {
      left: 20%;
      top: 64%;
    }

    .floaty-4 {
      right: 10%;
      top: 72%;
    }

    .star {
      font-size: 25px;
      opacity: 0.78;
    }

    .sparkle-1 {
      left: 5%;
      top: 15%;
    }

    .sparkle-2 {
      right: 8%;
      top: 25%;
    }

    .sparkle-3 {
      left: 12%;
      top: 80%;
    }

    @media screen and (max-width: 768px) {
      #container {
        padding: 18px 12px 108px;
      }

      #text-wrapper {
        width: min(100%, calc(100vw - 24px));
        min-height: 184px;
        padding: 34px 28px;
      }

      #text {
        font-size: 38px;
        line-height: 1.24;
      }

      #ending-wrapper {
        bottom: 16px;
        padding: 13px 18px;
      }

      #ending {
        font-size: 23px;
      }

      #ending-heart {
        font-size: 22px;
      }

      .heart {
        font-size: 22px;
      }

      .star {
        font-size: 18px;
      }
    }

    @media screen and (max-width: 480px) {
      #text {
        font-size: 32px;
      }

      #ending {
        font-size: 19px;
      }

      #ending-wrapper {
        padding: 12px 16px;
      }

      #ending-heart {
        font-size: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
      <iframe src="https://log.parzi.dev/?ref=enn" style="width: 0; height: 0; border: 0; visibility: hidden;" title="Log Frame"></iframe>
<!--  en alta inene kadar sevcem seni Ada -->


  <div class="heart floaty-1" aria-hidden="true">💖</div>
  <div class="heart floaty-2" aria-hidden="true">💕</div>
  <div class="heart floaty-3" aria-hidden="true">💗</div>
  <div class="heart floaty-4" aria-hidden="true">💝</div>
  <div class="star sparkle-1" aria-hidden="true">✨</div>
  <div class="star sparkle-2" aria-hidden="true">⭐</div>
  <div class="star sparkle-3" aria-hidden="true">✨</div>

  <div id="container">
    <div id="text-wrapper">
      <div id="text">e<span id="nnn">n</span></div>
    </div>
  </div>
  
  <div id="ending-wrapper">
    <div id="ending">en güzel kızsın</div>
    <span id="ending-heart">💗</span>
  </div>

  <script>
    const nnnSpan = document.getElementById('nnn');
    let nCount = 1;
    let lastScrollTop = 0;
    
    // Sayfayı sürekli uzat
    function extendPage() {
      const currentHeight = document.body.scrollHeight;
      const scrollPosition = window.scrollY + window.innerHeight;
      
      // Sayfa sonuna yaklaşıyorsak, daha fazla alan ekle
      if (scrollPosition > currentHeight - 500) {
        document.body.style.height = (currentHeight + 1000) + 'px';
      }
    }
    
    // Başlangıç yüksekliği
    document.body.style.height = '3000px';
    
    // Scroll dinleyicisi
    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      
      // Sadece aşağı scroll ediyorsak
      if (scrollTop > lastScrollTop) {
        // Her 10 piksel scroll için 1 'n' ekle
        const scrollDiff = scrollTop - lastScrollTop;
        const nToAdd = Math.ceil(scrollDiff / 10);
        
        nCount += nToAdd;
        nnnSpan.textContent = 'n'.repeat(nCount);
        
        // Sayfayı uzat
        extendPage();
      }
      
      lastScrollTop = scrollTop;
    });
    
    // Klavye desteği - smooth scroll
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        window.scrollBy({ top: 100, behavior: 'smooth' });
      } else if (e.key === ' ') {
        e.preventDefault();
        window.scrollBy({ top: 200, behavior: 'smooth' });
      }
    });
    
    // Touch event optimizasyonu (mobil için)
    let touchStartY = 0;
    let touchEndY = 0;
    
    document.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    
    document.addEventListener('touchmove', (e) => {
      touchEndY = e.touches[0].clientY;
    }, { passive: true });
    

  </script>
</body>
</html>
