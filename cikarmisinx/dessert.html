<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tatlı</title>
    <link rel="stylesheet" href="css/dessert.css" />
  </head>
  <body>
    <div id="dessertquestion"><b>HANGİ ÇİKOLATALI TATLIYI YİYELİM?</b></div>

    <div class="dessert-selection">
      <div class="dessert-item">
        <img src="food/cikolatasufle.png" alt="çikolatalı sufle" />
        <label
          ><input type="checkbox" name="dessert" value="sufle" /> Çikolatalı Sufle</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/brownie.png" alt="brownie" />
        <label
          ><input type="checkbox" name="dessert" value="brownie" /> Brownie</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/cikolatapuding.png" alt="çikolatalı puding" />
        <label><input type="checkbox" name="dessert" value="puding" /> Çikolatalı Puding</label>
      </div>
      <div class="dessert-item">
        <img src="food/Profiterol.png" alt="profiterol" />
        <label
          ><input type="checkbox" name="dessert" value="profiterol" /> Profiterol</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/trilece.png" alt="trileçe" />
        <label
          ><input type="checkbox" name="dessert" value="trilece" /> Trileçe</label
        >
      </div>
      <div class="dessert-item">
        <img src="food/cikolatapasta.png" alt="çikolatalı pasta" />
        <label
          ><input type="checkbox" name="dessert" value="pasta" />
          Çikolatalı Pasta</label
        >
      </div>
    </div>
    <button class="button" onclick="location.href='activities.html'">
      Devam Et
    </button>
  </body>
</html>
