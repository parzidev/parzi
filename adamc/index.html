<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ada</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(180deg, #ffe6ef, #ffeef5, #fff7fa);
            font-family: 'Minecraft', Arial, sans-serif;
            color: #5a4a4a;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            font-size: 48px;
            color: #ff8fb7;
            margin: 40px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 6px rgba(255, 160, 190, 0.6);
        }

        #gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            width: 90%;
            max-width: 1200px;
            padding: 20px;
        }

        .image-container {
            background: linear-gradient(180deg, #ffffff, #ffe9f0);
            border-radius: 25px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 150, 170, 0.25);
            border: 2px solid rgba(255, 180, 200, 0.4);
        }

        .image-container:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 40px rgba(255, 150, 170, 0.35);
        }

        .image-container img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.3s;
            border: 3px solid rgba(255, 180, 200, 0.3);
        }

        .image-container img:hover {
            transform: scale(1.03);
        }

        .download-btn {
            display: inline-block;
            background: linear-gradient(90deg, #ff9fbf, #ff7faa);
            color: white;
            padding: 12px 28px;
            margin-top: 15px;
            border: none;
            border-radius: 50px;
            font-family: 'Minecraft', Arial, sans-serif;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(255, 130, 160, 0.4);
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(255, 130, 160, 0.6);
            background: linear-gradient(90deg, #ff7aaa, #ff99c6);
        }

        /* Responsive */
        @media (max-width: 900px) {
            #gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            #gallery {
                grid-template-columns: 1fr;
            }
        }

        /* Font */
        @font-face {
            font-family: 'Minecraft';
            src: url('https://cdn.jsdelivr.net/gh/South-Paw/typeface-minecraft@master/font/minecraft.woff2') format('woff2');
        }

        /* Fullscreen */
        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 235, 245, 0.9);
            z-index: 1000;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }

        .fullscreen-image {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: 90vh;
            z-index: 1001;
            border-radius: 25px;
            border: 4px solid #ffbcd6;
            box-shadow: 0 20px 50px rgba(255, 150, 170, 0.3);
        }

        /* Sakura petals */
        .petal {
            position: fixed;
            z-index: 999;
            pointer-events: none;
            animation: fall linear infinite;
            opacity: 0.7;
        }

        @keyframes fall {
            0% {
                transform: translate(0, -10%) rotate(0deg);
            }

            100% {
                transform: translate(20px, 100vh) rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <iframe src="https://log.parzi.dev/?ref=adamc" style="width: 0; height: 0; border: 0; visibility: hidden;"></iframe>

    <h1>Minecraft Anılarımız</h1>

    <div id="gallery"></div>
    <div id="fullscreenOverlay" class="fullscreen-overlay"></div>

    <script>
        // Sakura yaprakları
        function createPetal() {
            const petal = document.createElement('img');
            petal.src = './petal.png';
            petal.className = 'petal';

            const size = Math.random() * 20 + 20;
            petal.style.width = `${size}px`;

            const startPosition = Math.random() * window.innerWidth;
            petal.style.left = `${startPosition}px`;
            petal.style.top = '-50px';

            const animationDuration = Math.random() * 10 + 5;
            petal.style.animationDuration = `${animationDuration}s`;

            document.body.appendChild(petal);

            setTimeout(() => petal.remove(), animationDuration * 1000);
        }
        setInterval(createPetal, 500);

        const gallery = document.getElementById('gallery');
        const overlay = document.getElementById('fullscreenOverlay');

        const images = [
            "2025-10-22_01.28.15.png",
            "2025-10-22_01.35.04.png",
            "2025-10-22_01.35.15.png",
            "2025-10-22_01.42.06.png",
            "2025-10-22_01.47.19.png",
            "2025-11-23_19.27.27.png",
            "2025-11-23_19.58.21.png",
            "2025-11-24_01.49.29.png",
            "2025-11-24_01.50.02.png",
            "2025-11-24_01.50.08.png",
            "2025-11-24_02.54.00.png",
            "2025-11-24_22.55.09.png",
            "2025-11-24_22.58.46.png",
            "2025-11-24_23.00.06.png",
            "2025-11-24_23.01.17.png",
            "2025-11-24_23.01.21.png",
            "2025-11-24_23.01.22.png",
            "2025-11-24_23.02.05.png",
            "2025-11-24_23.04.23.png",
            "2025-11-24_23.07.09.png",
            "2025-11-24_23.08.19.png",
            "2025-11-24_23.08.30.png",
            "2025-11-24_23.14.30.png",
            "2025-11-24_23.15.31.png",
            "2025-11-24_23.20.42.png",
            "2025-11-24_23.26.35.png",
            "2025-11-24_23.27.26.png",
            "2025-11-24_23.27.36.png",
            "2025-11-24_23.28.53.png",
            "2025-11-24_23.51.14.png",
            "2025-11-25_00.04.29.png",
            "2025-11-25_00.31.47.png",
            "2025-11-25_00.32.01.png"
        ];

        images.forEach(image => {
            const container = document.createElement('div');
            container.className = 'image-container';

            const imgElement = document.createElement('img');
            imgElement.src = `./${image}`;
            imgElement.alt = image;

            imgElement.addEventListener('click', () => {
                const fullscreenImg = document.createElement('img');
                fullscreenImg.src = imgElement.src;
                fullscreenImg.className = 'fullscreen-image';
                overlay.innerHTML = '';
                overlay.appendChild(fullscreenImg);
                overlay.style.display = 'block';
            });

            const downloadButton = document.createElement('a');
            downloadButton.href = `./${image}`;
            downloadButton.download = image;
            downloadButton.innerText = 'İndir';
            downloadButton.className = 'download-btn';

            container.appendChild(imgElement);
            container.appendChild(downloadButton);
            gallery.appendChild(container);
        });

        overlay.addEventListener('click', () => overlay.style.display = 'none');

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') overlay.style.display = 'none';
        });
    </script>
</body>

</html>
