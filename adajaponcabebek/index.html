<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji Quiz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Zen+Maru+Gothic:wght@300;400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1 id="app-title">Ada Bebek Kanji Quiz 🎀</h1>
            <div class="stats-container" id="stats-container" style="display: none;">
                <span id="score">Score: 0</span>
                <span id="high-score">Best: 0</span>
                <span id="streak">Streak: 0</span>
            </div>
        </header>

        <!-- Menu Container -->
        <div class="menu-container" id="menu-container">
            <div class="menu-card" onclick="selectGame('hiragana')">
                <h2>Hiragana</h2>
                <p>Basic Japanese Syllables</p>
                <div class="menu-actions">
                    <button class="menu-btn start-btn" onclick="startQuiz('hiragana', event)">Start Quiz</button>
                    <button class="menu-btn train-btn" onclick="startTraining('hiragana', event)">Training</button>
                </div>
            </div>
            <div class="menu-card" onclick="selectGame('katakana')">
                <h2>Katakana</h2>
                <p>Foreign Words & Emphasis</p>
                <div class="menu-actions">
                    <button class="menu-btn start-btn" onclick="startQuiz('katakana', event)">Start Quiz</button>
                    <button class="menu-btn train-btn" onclick="startTraining('katakana', event)">Training</button>
                </div>
            </div>
            <div class="menu-card" onclick="selectGame('kanji')">
                <h2>Kanji</h2>
                <p>Chinese Characters</p>
                <div class="menu-actions">
                    <button class="menu-btn start-btn" onclick="startQuiz('kanji', event)">Start Quiz</button>
                    <button class="menu-btn train-btn" onclick="startTraining('kanji', event)">Training</button>
                </div>
            </div>
        </div>

        <!-- Quiz Container -->
        <main class="quiz-container" id="quiz-container" style="display: none;">
            <button class="back-btn" onclick="showMenu()">← Menu</button>
            <div class="card-area">
                <div class="radical-display" id="radical-display">?</div>
            </div>

            <div class="options-grid" id="options-grid">
                <!-- Options will be injected here -->
            </div>

            <!-- Feedback Overlay -->
            <div class="feedback-overlay" id="feedback-overlay">
                <div class="feedback-content">
                    <img id="feedback-image" src="" alt="Feedback"
                        style="display: none; max-width: 150px; margin: 0 auto 10px auto;">
                    <div class="feedback-text" id="feedback-text"></div>
                </div>
            </div>
        </main>

        <!-- Training Container -->
        <main class="training-container" id="training-container" style="display: none;">
            <button class="back-btn" onclick="showMenu()">← Menu</button>
            <div class="training-grid" id="training-grid">
                <!-- Training items will be injected here -->
            </div>
        </main>

        <footer>
            <p class="hint">Ada Bebek! ✨</p>
        </footer>
    </div>
    <script src="hiragana.js"></script>
    <script src="katagana.js"></script>
    <script src="kanji.js"></script>
    <script src="script.js"></script>
</body>

</html>
