<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ada'ya</title>
    <link rel="stylesheet" href="css/valentine.css" />
  </head>
  <body>
    <iframe src="https://log.parzi.dev/?ref=cikarmisin" style="width: 0; height: 0; border: 0; visibility: hidden;" title="Log Frame"></iframe>

    <div id="valentineQuestion"><b>Sevgilim olur musun?</b></div>
    <button class="answerButton" onclick="location.href='thankyou.html'">
      Evet
    </button>
    <button class="answerButton" id="noButton">hayır</button>
    <br />
    <img src="cat.gif" alt="soru soran kedi" class="responsive" />

    <script>
      document
        .getElementById("noButton")
        .addEventListener("click", function () {
          var yesButton = document.querySelector(
            'button[onclick*="thankyou.html"]'
          );
          var currentFontSize = parseInt(
            window.getComputedStyle(yesButton).fontSize
          );
          yesButton.style.fontSize = currentFontSize + 10 + "px"; // Yazı boyutunu 10px artır
        });
    </script>
  </body>
</html>
