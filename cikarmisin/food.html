<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yemek Seçimi</title>
    <link rel="stylesheet" href="css/food.css" />
  </head>
  <body>
    <div id="foodquestion">
      <b>Hangi yemeği yemek istersin?</b>
    </div>

    <div class="food-selection">
      <div class="food-item">
        <img src="food/burgers.jpeg" alt="Hamburger, patates ve kızarmış tavuk" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="Burgers, fries and fried chicken"
          />
          hamburger ve kızarmış tavuk</label
        >
      </div>
      <div class="food-item">
        <img src="food/dog.jpeg" alt="sosisli" />
        <label
          ><input type="checkbox" name="food" value="hotdog" /> sosisli sandviç</label
        >
      </div>
      <div class="food-item">
        <img src="food/koreanfood.jpeg" alt="Kore yemeği" />
        <label
          ><input type="checkbox" name="food" value="Korean food" /> Kore
          yemeği</label
        >
      </div>
      <div class="food-item">
        <img src="food/pasta.jpeg" alt="makarna" />
        <label><input type="checkbox" name="food" value="pasta" /> makarna</label>
      </div>
      <div class="food-item">
        <img src="food/pizza.jpeg" alt="pizza" />
        <label><input type="checkbox" name="food" value="pizza" /> pizza</label>
      </div>
      <div class="food-item">
        <img src="food/salad.jpeg" alt="salata" />
        <label><input type="checkbox" name="food" value="salad" /> salata</label>
      </div>
      <div class="food-item">
        <img src="food/steak.jpeg" alt="biftek" />
        <label><input type="checkbox" name="food" value="steak" /> biftek</label>
      </div>
      <div class="food-item">
        <img src="food/sushi.jpeg" alt="suşi" />
        <label><input type="checkbox" name="food" value="sushi" /> suşi</label>
      </div>
    </div>
    <button class="button" onclick="location.href='dessert.html'">
      Devam Et UWU
    </button>
  </body>
</html>
