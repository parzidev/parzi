<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Şarkı Sözü | Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --surface-2: #1c1c1e;
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            --accent: #3b82f6;
            --accent-soft: rgba(59, 130, 246, 0.15);
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* App Container */
        .app {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 12px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--surface-2);
            border: none;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .header-btn:active {
            transform: scale(0.95);
            background: var(--accent-soft);
        }

        .header-btn svg {
            width: 22px;
            height: 22px;
        }

        /* Search Bar */
        .search-container {
            padding: 12px 16px;
            background: var(--bg);
        }

        .search-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-bar svg {
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .search-bar input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        /* Views */
        .view {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .view.hidden {
            display: none;
        }

        /* Song List */
        .song-list {
            padding: 8px 16px 100px;
        }

        .song-item {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .song-item:active {
            transform: scale(0.98);
            border-color: var(--accent);
        }

        .song-item.active {
            border-color: var(--accent);
            background: linear-gradient(135deg, var(--surface) 0%, var(--accent-soft) 100%);
        }

        .song-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .song-artist {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Song Detail View */
        .detail-view {
            padding: 0 16px 120px;
        }

        .detail-header {
            padding: 24px 0;
            text-align: center;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .detail-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .detail-artist {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .meta-chips {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chip {
            background: var(--surface-2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .chip span {
            color: var(--accent);
            font-weight: 600;
        }

        .lyrics-container {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
        }

        .lyrics {
            font-size: 15px;
            line-height: 2;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: rgba(255, 255, 255, 0.85);
        }

        .chord {
            color: var(--accent);
            font-weight: 600;
        }

        /* Chord Drawer */
        .chord-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            border-radius: 24px 24px 0 0;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            z-index: 200;
            max-height: 60vh;
        }

        .chord-drawer.open {
            transform: translateY(0);
        }

        .drawer-handle {
            width: 36px;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            margin: 10px auto 8px;
        }

        .drawer-title {
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            padding: 8px 16px 16px;
        }

        .chord-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
            padding: 0 16px 24px;
            overflow-y: auto;
            max-height: calc(60vh - 80px);
        }

        .chord-card {
            background: var(--surface-2);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .chord-card .name {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .chord-card svg {
            width: 80px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* FAB */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--accent);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
            cursor: pointer;
            transition: all 0.2s;
            z-index: 150;
        }

        .fab:active {
            transform: scale(0.92);
        }

        .fab svg {
            width: 24px;
            height: 24px;
        }

        .fab.hidden {
            display: none;
        }

        /* Shuffle FAB */
        .shuffle-fab {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border: none;
            color: white;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.35);
            transition: all 0.2s;
            z-index: 100;
        }

        .shuffle-fab:active {
            transform: translateX(-50%) scale(0.95);
        }

        .shuffle-fab svg {
            width: 18px;
            height: 18px;
        }

        /* Backdrop */
        .backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 150;
        }

        .backdrop.visible {
            opacity: 1;
            visibility: visible;
        }

        /* Empty State */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            color: var(--text-muted);
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* Smooth Scrollbar */
        .view::-webkit-scrollbar {
            width: 4px;
        }

        .view::-webkit-scrollbar-track {
            background: transparent;
        }

        .view::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .chord-grid::-webkit-scrollbar {
            width: 4px;
        }

        .chord-grid::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeIn 0.3s ease forwards;
        }
    </style>
</head>

<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <button class="header-btn back-btn hidden" id="backBtn" onclick="showList()">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <h1 class="header-title" id="headerTitle">Şarkılar</h1>
        </header>

        <!-- List View -->
        <div class="view" id="listView">
            <div class="search-container">
                <div class="search-bar">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8" />
                        <path stroke-linecap="round" d="M21 21l-4.35-4.35" />
                    </svg>
                    <input type="text" placeholder="Ara..." id="searchInput" oninput="filterSongs()">
                </div>
            </div>
            <div class="song-list" id="songList"></div>
            <button class="shuffle-fab" onclick="randomSong()">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Rastgele
            </button>
        </div>

        <!-- Detail View -->
        <div class="view hidden" id="detailView">
            <div class="detail-view" id="detailContent"></div>
        </div>

        <!-- Chord FAB -->
        <button class="fab hidden" id="chordFab" onclick="toggleChordDrawer()">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" />
                <path stroke-linecap="round" d="M8 12h8M12 8v8" />
            </svg>
        </button>

        <!-- Backdrop -->
        <div class="backdrop" id="backdrop" onclick="toggleChordDrawer()"></div>

        <!-- Chord Drawer -->
        <div class="chord-drawer" id="chordDrawer">
            <div class="drawer-handle"></div>
            <div class="drawer-title">Akorlar</div>
            <div class="chord-grid" id="chordGrid"></div>
        </div>
    </div>

    <script>
        let allSongs = [];
        let currentSong = null;
        let chordDrawerOpen = false;

        // Init
        async function init() {
            try {
                const res = await fetch('detayli_sarki_bilgileri_restructured.json');
                allSongs = await res.json();
                renderList(allSongs);
                handleHash();
                window.onhashchange = handleHash;
            } catch (e) {
                console.error('Data load error:', e);
            }
        }

        function handleHash() {
            const hash = window.location.hash;
            if (hash.startsWith('#song/')) {
                const id = parseInt(hash.split('/')[1]);
                loadSong(id);
            } else {
                showList();
            }
        }

        function renderList(list) {
            if (list.length === 0) {
                document.getElementById('songList').innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 9l10.5-3m0 6.553v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 11-.99-3.467l2.31-.66a2.25 2.25 0 001.632-2.163zm0 0V2.25L9 5.25v10.303m0 0v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 01-.99-3.467l2.31-.66A2.25 2.25 0 009 15.553z"/>
                        </svg>
                        <p>Şarkı bulunamadı</p>
                    </div>
                `;
                return;
            }

            const html = list.map((s, i) => `
                <div class="song-item animate-in ${currentSong?.id === s.id ? 'active' : ''}" 
                     style="animation-delay: ${i * 0.03}s"
                     onclick="window.location.hash='#song/${s.id}'">
                    <div class="song-name">${s.sarkiadi}</div>
                    <div class="song-artist">${s.sanatci}</div>
                </div>
            `).join('');
            document.getElementById('songList').innerHTML = html;
        }

        function filterSongs() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allSongs.filter(s =>
                s.sarkiadi.toLowerCase().includes(q) ||
                s.sanatci.toLowerCase().includes(q)
            );
            renderList(filtered);
        }

        function showList() {
            document.getElementById('listView').classList.remove('hidden');
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('backBtn').classList.add('hidden');
            document.getElementById('headerTitle').textContent = 'Şarkılar';
            document.getElementById('chordFab').classList.add('hidden');
            closeChordDrawer();
            currentSong = null;
            window.location.hash = '';
        }

        async function loadSong(id) {
            const song = allSongs.find(s => s.id === id);
            if (!song) return;

            currentSong = song;

            // Update UI
            document.getElementById('listView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            document.getElementById('backBtn').classList.remove('hidden');
            document.getElementById('headerTitle').textContent = song.sarkiadi;
            document.getElementById('chordFab').classList.remove('hidden');

            // Render detail
            const content = document.getElementById('detailContent');
            content.innerHTML = `
                <div class="detail-header animate-in">
                    <h1 class="detail-title">${song.sarkiadi}</h1>
                    <p class="detail-artist">${song.sanatci}</p>
                    <div class="meta-chips">
                        <div class="chip">Ton: <span>${song.orjinal_ton || '-'}</span></div>
                        <div class="chip">Kapo: <span>${song.kapo || '0'}</span></div>
                    </div>
                </div>
                <div class="lyrics-container animate-in" style="animation-delay: 0.1s">
                    <div class="lyrics">${parseLyrics(song.lyrics_data?.lines || [])}</div>
                </div>
            `;

            // Load chords
            loadChords(song.used_chords || []);

            // Scroll to top
            document.getElementById('detailView').scrollTop = 0;
        }

        function parseLyrics(lines) {
            return lines.map(line => {
                let text = line.content || '';
                if (line.chords) {
                    const sorted = [...new Set(line.chords)].sort((a, b) => b.length - a.length);
                    sorted.forEach(chord => {
                        const escaped = chord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const regex = new RegExp(`(?<![A-Za-z0-9#b])${escaped}(?![A-Za-z0-9#b])`, 'g');
                        text = text.replace(regex, `<span class="chord">${chord}</span>`);
                    });
                }
                return text;
            }).join('\n');
        }

        async function loadChords(chords) {
            const grid = document.getElementById('chordGrid');

            if (!chords.length) {
                grid.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 20px;">Akor bulunamadı</p>';
                return;
            }

            grid.innerHTML = chords.map(c => `
                <div class="chord-card">
                    <div class="name">${c}</div>
                    <div id="svg-${c.replace('#', 'sharp').replace(/[^a-zA-Z0-9]/g, '_')}">...</div>
                </div>
            `).join('');

            for (const chord of chords) {
                const id = `svg-${chord.replace('#', 'sharp').replace(/[^a-zA-Z0-9]/g, '_')}`;
                const container = document.getElementById(id);

                try {
                    let res = await fetch(`test_chords/${encodeURIComponent(chord)}.svg`);
                    if (!res.ok) {
                        const base = chord.replace(/[0-9]/g, '');
                        res = await fetch(`test_chords/${encodeURIComponent(base)}.svg`);
                    }
                    if (res.ok) {
                        container.innerHTML = await res.text();
                    } else {
                        container.innerHTML = '<span style="font-size: 11px; color: var(--text-muted);">N/A</span>';
                    }
                } catch (e) {
                    container.innerHTML = '<span style="font-size: 11px; color: var(--text-muted);">ERR</span>';
                }
            }
        }

        function toggleChordDrawer() {
            chordDrawerOpen = !chordDrawerOpen;
            document.getElementById('chordDrawer').classList.toggle('open', chordDrawerOpen);
            document.getElementById('backdrop').classList.toggle('visible', chordDrawerOpen);
        }

        function closeChordDrawer() {
            chordDrawerOpen = false;
            document.getElementById('chordDrawer').classList.remove('open');
            document.getElementById('backdrop').classList.remove('visible');
        }

        function randomSong() {
            const song = allSongs[Math.floor(Math.random() * allSongs.length)];
            window.location.hash = `#song/${song.id}`;
        }

        init();
    </script>
</body>

</html>
