<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>?</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            background: #eeece6;
            color: #64635e;
            font: 13px/1.6 ui-monospace, "SFMono-Regular", Consolas, monospace;
        }

        main {
            position: absolute;
            top: 42%;
            left: 22%;
            right: 24px;
        }

        p { margin: 0; }

        @media (max-width: 600px) {
            main { left: 12%; }
        }
    </style>
</head>
<body>
    <main><p>neden burdasın?</p></main>
    <iframe id="visit-log" title="Ziyaret kaydı" aria-hidden="true" tabindex="-1" referrerpolicy="no-referrer" style="position: absolute; top: 0; left: 0; width: 0; height: 0; border: 0; visibility: hidden;"></iframe>
    <script>
        (() => {
            const sourceHost = location.hash.slice(1).toLowerCase();
            const source = sourceHost.match(/^([a-z0-9-]+(?:\.[a-z0-9-]+)*)\.parzi\.dev$/);
            const ref = source && sourceHost.length <= 253 ? ('who-' + source[1]).slice(0, 80) : 'who';
            const encodedRef = encodeURIComponent(ref);
            const logger = document.createElement('script');
            logger.defer = true;
            logger.src = 'https://log.parzi.dev/__parzi/auto.js?ref=' + encodedRef;
            document.head.appendChild(logger);
            document.getElementById('visit-log').src = 'https://log.parzi.dev/?ref=' + encodedRef;
        })();
    </script>
</body>
</html>
