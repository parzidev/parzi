    <style>
      /* Basit, yumuşak görünüm — daha koyu pembe/krem tema */
      :root {
        --bg: #e9a4bd;  /* koyu pembe */
        --bg2: #e3c5a1; /* koyu krem/tan */
        --dot: #c2185b; /* nokta rengi (gül pembe) */
        --shadow: rgba(194, 24, 91, 0.18);
        --text: #3b0d1a; /* metin rengi */
        --header-bg: rgba(255, 255, 255, 0.45);
        --header-border: rgba(0, 0, 0, 0.06);
      }

      html, body { height: 100%; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: linear-gradient(180deg, var(--bg), var(--bg2));
        transition: background 1.8s ease;
        display: grid;
        place-items: center; /* ortada tek büyük nokta */
        overflow-x: hidden;   /* yatay kaydırmayı engelle */
        overflow-y: hidden;   /* emojiler taşarken scrollbar olmasın */
        -webkit-tap-highlight-color: transparent;
        /* Tatlı pembe kalp imleç */
        cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' viewBox='0 0 24 24'><path fill='%23ff5c93' d='M12 21s-6.716-4.432-9.332-7.047C.84 12.125.5 9.29 2.343 7.448c1.843-1.843 4.679-1.503 6.505.323L12 10.924l3.152-3.153c1.826-1.826 4.662-2.166 6.505-.323 1.843 1.843 1.503 4.679-.325 6.505C18.716 16.568 12 21 12 21z'/></svg>") 4 2, auto;
      }

      /* Ortadaki büyük nokta (●) — buton olarak erişilebilir kılındı */
      #toggle {
        position: relative;
        z-index: 2; /* emojilerin üstünde kalsın */
        background: transparent;
        border: none;
        padding: 0;
        line-height: 1;
        cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 24 24'><path fill='%23ff5c93' d='M12 21s-6.716-4.432-9.332-7.047C.84 12.125.5 9.29 2.343 7.448c1.843-1.843 4.679-1.503 6.505.323L12 10.924l3.152-3.153c1.826-1.826 4.662-2.166 6.505-.323 1.843 1.843 1.503 4.679-.325 6.505C18.716 16.568 12 21 12 21z'/></svg>") 4 2, auto;
        user-select: none;
        color: var(--dot);
        font-size: clamp(56px, 16vw, 180px);
        text-shadow: 0 4px 12px var(--shadow);
        transition: transform 160ms ease;
        touch-action: manipulation;
      }
      #toggle:active { transform: translate(-50%, -50%) scale(0.98); }
      #toggle.is-holding { opacity: 0.72; }
      #toggle:focus-visible {
        outline: none;
        box-shadow: 0 0 0 8px rgba(194, 24, 91, 0.08);
        border-radius: 50%;
      }

      /* Emojiler için katman; tıklamayı engellemesin diye pointer-events kapalı */
      #emoji-layer {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }

      #ambient-layer {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        transform: translate3d(var(--tilt-x, 0px), var(--tilt-y, 0px), 0);
        transition: transform 220ms ease-out;
      }

      .ambient-star {
        position: absolute;
        color: rgba(255, 242, 248, 0.72);
        text-shadow: 0 0 10px rgba(255, 220, 238, 0.44);
        animation: star-twinkle var(--ambient-duration) ease-in-out infinite alternate;
      }

      .light-mote {
        position: absolute;
        width: var(--mote-size);
        height: var(--mote-size);
        border-radius: 50%;
        background: rgba(255, 250, 225, 0.38);
        box-shadow: 0 0 18px rgba(255, 246, 205, 0.52);
        animation: mote-drift var(--ambient-duration) ease-in-out infinite alternate;
      }

      /* Her bir emojinin dış sarmalayıcısı: yatay salınım + dönüş burada */
      .flake {
        position: absolute; /* Mutlak konumlandırma */
        /* Başlangıç noktası olarak toggle butonunun merkezi */
        top: 0;
        left: 0;
        transform: translate(-50%, -50%);
        will-change: transform;
        filter: drop-shadow(0 4px 10px var(--shadow));
        /* Sway animasyonu: hafif salınım ve dönüş etkisi */
        animation: sway var(--sway-duration) ease-in-out infinite alternate;
      }

      /* Yükseliş animasyonu iç span'da, böylece transform çakışmaz */
      .flake > span {
        display: inline-block;
        will-change: transform;
        animation: rise var(--rise-duration) linear forwards;
      }

      /* Noktaya kısa dokunuşta çevreye yayılan emojiler */
      .burst-flake {
        position: fixed;
        z-index: 8;
        pointer-events: none;
        will-change: transform, opacity;
        filter: drop-shadow(0 5px 12px var(--shadow));
        animation: burst-pop var(--burst-duration) cubic-bezier(.18, .76, .28, 1) forwards;
      }

      .rain-flake {
        position: fixed;
        top: -72px;
        z-index: 9;
        pointer-events: none;
        will-change: transform, opacity;
        filter: drop-shadow(0 5px 12px var(--shadow));
        animation: emoji-rain var(--rain-duration) cubic-bezier(.24, .65, .44, 1) var(--rain-delay) forwards;
      }

      /* Yatay salınım ve dönüş (açılar değişken) */
      @keyframes sway {
        0%   { transform: translate(-50%, -50%) translateX(calc(var(--sway) * -1)) rotate(var(--rot-start)); }
        100% { transform: translate(-50%, -50%) translateX(var(--sway)) rotate(var(--rot-end)); }
      }

      /* Aşağıdan yukarı yükseliş */
      @keyframes rise {
        from { transform: translateY(0); opacity: 1; }
        to   { transform: translateY(-80vh); opacity: 0; }
      }

      @keyframes burst-pop {
        0% {
          transform: translate(-50%, -50%) scale(0.25) rotate(0deg);
          opacity: 0;
        }
        14% { opacity: 1; }
        100% {
          transform: translate(-50%, -50%) translate(var(--burst-x), var(--burst-y)) scale(0.88) rotate(var(--burst-rotation));
          opacity: 0;
        }
      }

      @keyframes star-twinkle {
        from { opacity: 0.12; transform: scale(0.72); }
        to { opacity: 0.58; transform: scale(1.08); }
      }

      @keyframes mote-drift {
        from { opacity: 0.08; transform: translate3d(0, 12px, 0) scale(0.78); }
        to { opacity: 0.44; transform: translate3d(var(--mote-x), var(--mote-y), 0) scale(1.12); }
      }

      @keyframes emoji-rain {
        0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
        8% { opacity: 1; }
        100% { transform: translate3d(var(--rain-drift), 115vh, 0) rotate(var(--rain-rotation)); opacity: 0.12; }
      }

      /* Hareket azaltma tercihi olanlar için: daha az animasyon ve üretim */
      @media (prefers-reduced-motion: reduce) {
        .flake { animation-duration: 6s; }
        .flake > span { animation-duration: 8s; }
        .burst-flake { animation-duration: 700ms; }
        .ambient-star,
        .light-mote { animation: none; opacity: 0.22; }
      }
      
      /* Ortadaki noktayı belirginleştirmek için */
      #toggle {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10; /* emojilerin üstünde kalsın */
      }
      
      /* Emojilerin çıkış noktasını tam olarak noktaya sabitlemek için */
      #emoji-spawn-point {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1px;
        height: 1px;
        pointer-events: none;
        z-index: 5;
      }
      
      /* Ortadan aşağı inen kırmızı çizgi */
      #center-line {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 52.4%;
        transform: translateX(-50%);
        width: 2px;
        background: red;
        pointer-events: none;
        z-index: 6;
      }
      
      /* Arkaplanda gün sayacı */
      #day-counter {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        user-select: none;
        z-index: 0; /* arkaplanda kalsın */
        font-weight: 800;
        font-size: clamp(120px, 30vw, 360px);
        line-height: 1;
        color: var(--text);
        opacity: 0.12;
        text-shadow: 0 8px 24px var(--shadow);
      }

    </style>

      // Dinamik favicon: her saniye rastgele tatlı emojisi
      (function(){
        const EMOJI_SET = ["🍰","🍩","🧁","🍪","🍨","🍧","🍮","🍫","🍦","🍭","🍬"];
        const link = document.getElementById('favicon');
        const canvas = document.createElement('canvas');
        const size = 64; // yüksek çözünürlük, tarayıcı küçültür
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');

        function drawFavicon() {
          // Arka plan baloncuğu
          ctx.clearRect(0, 0, size, size);
          const g = ctx.createLinearGradient(0, 0, size, size);
          g.addColorStop(0, '#ffffff');
          g.addColorStop(1, '#ffd1e2');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
          ctx.fill();

          // Emoji çiz
          const emoji = EMOJI_SET[Math.floor(Math.random()*EMOJI_SET.length)];
          ctx.font = '42px "Apple Color Emoji", "Segoe UI Emoji", system-ui';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(emoji, size/2, size/2 + 2);

          // Data URL olarak ata
          const url = canvas.toDataURL('image/png');
          link.href = url;
        }

        drawFavicon();
        setInterval(drawFavicon, 1000);
      })();
      // Basit yardımcılar
      const EMOJIS = ["🍰","🍩","🧁","🍪","🍨","🍧","🍮","🍫","🍦","🍭","🍬"];
      const layer = document.getElementById("emoji-layer");
      const toggleBtn = document.getElementById("toggle");
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)');

      const MAX_ACTIVE = prefersReduced.matches ? 16 : 36;
      const SPAWN_INTERVAL_MS = prefersReduced.matches ? 400 : 220;

      let isGenerating = true; // tıklamayla aç/kapa
      let isPageVisible = true; // sekme görünür değilken üretimi duraklat
      let activeCount = 0;     // canlı emoji adedi

      // Rastgele sayı [min, max]
      function rand(min, max) { return Math.random() * (max - min) + min; }
      function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
      function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

      // Tek bir emoji oluştur ve katmana ekle
      function spawnEmoji() {
        if (!isGenerating || !isPageVisible) return; // üretim kapalıysa ya da görünür değilse çık
        if (activeCount >= MAX_ACTIVE) return; // sınır aşıyorsa bekle

        const wrapper = document.createElement('div');
        wrapper.className = 'flake';
        
        // Noktanın tam konumunu al
        const toggleRect = toggleBtn.getBoundingClientRect();
        wrapper.style.left = (toggleRect.left + toggleRect.width/2) + 'px';
        wrapper.style.top = (toggleRect.top + toggleRect.height/2) + 'px';

        // Boyut (px) — biraz daha büyük aralık
        const sizePx = rand(28, 64);

        // Yükseliş süresi ve salınım parametreleri (daha hızlı ve belirgin)
        const riseSec = rand(4.2, 9.0);      // daha kısa = daha hızlı yükseliş
        const swaySec = rand(2.2, 4.8);
        const swayAmp = rand(14, 56);        // px cinsinden yatay genlik

        // Dönüş açıları (derece) — hafifçe sağa/sola dönsün
        const rotStart = randInt(-35, 5) + 'deg';
        const rotEnd   = randInt(8, 35) + 'deg';

        // CSS değişkenleri ile animasyonları parametrize et
        wrapper.style.setProperty('--sway-duration', swaySec + 's');
        wrapper.style.setProperty('--sway', swayAmp + 'px');
        wrapper.style.setProperty('--rot-start', rotStart);
        wrapper.style.setProperty('--rot-end',   rotEnd);
        wrapper.style.setProperty('--rise-duration', riseSec + 's');

        // İçeriği (emoji) taşıyan span — yükseliş animasyonu burada
        const span = document.createElement('span');
        span.textContent = choice(EMOJIS);
        span.style.fontSize = sizePx + 'px';

        // Yükseliş bittiğinde DOM'dan temizle
        span.addEventListener('animationend', () => {
          wrapper.remove();
          activeCount = Math.max(0, activeCount - 1);
        }, { once: true });

        wrapper.appendChild(span);
        layer.appendChild(wrapper);
        activeCount += 1;
      }

      // Kısa dokunuşta emojileri noktanın çevresine yay.
      function burstEmojis() {
        const toggleRect = toggleBtn.getBoundingClientRect();
        const originX = toggleRect.left + toggleRect.width / 2;
        const originY = toggleRect.top + toggleRect.height / 2;
        const amount = prefersReduced.matches ? 8 : 20;
        const radius = Math.min(window.innerWidth, window.innerHeight) * (prefersReduced.matches ? 0.18 : 0.34);

        for (let i = 0; i < amount; i++) {
          const angle = (Math.PI * 2 * i / amount) + rand(-0.16, 0.16);
          const distance = rand(radius * 0.5, radius);
          const flake = document.createElement('span');

          flake.className = 'burst-flake';
          flake.textContent = choice(EMOJIS);
          flake.style.left = originX + 'px';
          flake.style.top = originY + 'px';
          flake.style.fontSize = rand(25, 52) + 'px';
          flake.style.setProperty('--burst-x', Math.cos(angle) * distance + 'px');
          flake.style.setProperty('--burst-y', Math.sin(angle) * distance + 'px');
          flake.style.setProperty('--burst-rotation', randInt(-160, 160) + 'deg');
          flake.style.setProperty('--burst-duration', rand(0.85, 1.35) + 's');
          flake.addEventListener('animationend', () => flake.remove(), { once: true });
          layer.appendChild(flake);
        }
      }

      // Telefon sallandığında yukarıdan tatlı emojiler yağdır.
      function rainEmojis() {
        const amount = prefersReduced.matches ? 14 : 38;

        for (let i = 0; i < amount; i++) {
          const flake = document.createElement('span');
          flake.className = 'rain-flake';
          flake.textContent = choice(EMOJIS);
          flake.style.left = rand(2, 98) + 'vw';
          flake.style.fontSize = rand(24, 52) + 'px';
          flake.style.setProperty('--rain-drift', rand(-90, 90) + 'px');
          flake.style.setProperty('--rain-rotation', randInt(-280, 280) + 'deg');
          flake.style.setProperty('--rain-duration', rand(3.2, 5.4) + 's');
          flake.style.setProperty('--rain-delay', rand(0, 0.55) + 's');
          flake.addEventListener('animationend', () => flake.remove(), { once: true });
          layer.appendChild(flake);
        }
      }

      // Düzenli aralıklarla yeni emojiler üret
      const spawnTimer = setInterval(spawnEmoji, SPAWN_INTERVAL_MS);

      // Uzun basışta sürekli emoji akışını aç/kapa.
      function toggleGeneration() {
        isGenerating = !isGenerating;
        toggleBtn.setAttribute('aria-pressed', String(isGenerating));
        // Küçük bir görsel ipucu: aktifken hafif büyüsün (merkezde kalmayı koru)
        toggleBtn.style.transform = isGenerating
          ? 'translate(-50%, -50%) scale(1.04)'
          : 'translate(-50%, -50%) scale(1)';
      }

      let holdTimer;
      let didLongPress = false;

      toggleBtn.addEventListener('pointerdown', (event) => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        didLongPress = false;
        toggleBtn.setPointerCapture(event.pointerId);
        toggleBtn.classList.add('is-holding');
        holdTimer = window.setTimeout(() => {
          didLongPress = true;
          toggleBtn.classList.remove('is-holding');
          toggleGeneration();
          if (navigator.vibrate) navigator.vibrate(24);
        }, 550);
      });

      function cancelHold() {
        window.clearTimeout(holdTimer);
        toggleBtn.classList.remove('is-holding');
      }

      toggleBtn.addEventListener('pointerup', cancelHold);
      toggleBtn.addEventListener('pointercancel', cancelHold);
      toggleBtn.addEventListener('contextmenu', (event) => event.preventDefault());
      toggleBtn.addEventListener('click', () => {
        if (didLongPress) {
          didLongPress = false;
          return;
        }
        burstEmojis();
      });

      let motionEnabled = false;
      let orientationEnabled = false;
      let lastShakeAt = 0;
      let previousAcceleration = null;
      let orientationBase = null;

      function handleDeviceMotion(event) {
        if (!isPageVisible) return;
        const linear = event.acceleration;
        const linearAvailable = linear && [linear.x, linear.y, linear.z].some(Number.isFinite);
        const acceleration = linearAvailable ? linear : event.accelerationIncludingGravity;
        if (!acceleration) return;

        const x = Number.isFinite(acceleration.x) ? acceleration.x : 0;
        const y = Number.isFinite(acceleration.y) ? acceleration.y : 0;
        const z = Number.isFinite(acceleration.z) ? acceleration.z : 0;
        if (previousAcceleration === null) {
          previousAcceleration = { x, y, z };
          return;
        }

        const delta = Math.sqrt(
          (x - previousAcceleration.x) ** 2
          + (y - previousAcceleration.y) ** 2
          + (z - previousAcceleration.z) ** 2
        );
        previousAcceleration = { x, y, z };
        const threshold = linearAvailable ? 7 : 4.5;
        const now = Date.now();

        if (delta > threshold && now - lastShakeAt > 2800) {
          lastShakeAt = now;
          rainEmojis();
        }
      }

      function startMotionListener() {
        if (motionEnabled) return;
        motionEnabled = true;
        window.addEventListener('devicemotion', handleDeviceMotion, { passive: true });
      }

      function handleDeviceOrientation(event) {
        const beta = Number(event.beta);
        const gamma = Number(event.gamma);
        if (!Number.isFinite(beta) || !Number.isFinite(gamma)) return;

        if (orientationBase === null) {
          orientationBase = { beta, gamma };
          return;
        }

        const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
        const tiltX = clamp((gamma - orientationBase.gamma) * 0.72, -24, 24);
        const tiltY = clamp((beta - orientationBase.beta) * 0.56, -18, 18);
        document.getElementById('ambient-layer').style.setProperty('--tilt-x', tiltX + 'px');
        document.getElementById('ambient-layer').style.setProperty('--tilt-y', tiltY + 'px');
      }

      function startOrientationListener() {
        if (orientationEnabled) return;
        orientationEnabled = true;
        window.addEventListener('deviceorientation', handleDeviceOrientation, { passive: true });
        window.addEventListener('orientationchange', () => { orientationBase = null; }, { passive: true });
      }

      async function enableSensors() {
        const motionSensor = window.DeviceMotionEvent;
        const orientationSensor = window.DeviceOrientationEvent;
        if (!motionSensor && !orientationSensor) return;

        const motionPermission = motionSensor && typeof motionSensor.requestPermission === 'function'
          ? motionSensor.requestPermission()
          : Promise.resolve('granted');
        const orientationPermission = orientationSensor && typeof orientationSensor.requestPermission === 'function'
          ? orientationSensor.requestPermission()
          : Promise.resolve('granted');
        const [motionResult, orientationResult] = await Promise.all([
          motionPermission.catch(() => 'denied'),
          orientationPermission.catch(() => 'denied')
        ]);

        if (motionSensor && (motionResult === 'granted' || typeof motionSensor.requestPermission !== 'function')) {
          startMotionListener();
        }
        if (orientationSensor && (orientationResult === 'granted' || typeof orientationSensor.requestPermission !== 'function')) {
          startOrientationListener();
        }
        if (motionResult !== 'granted' || orientationResult !== 'granted') {
          console.debug('Hareket sensörü izni alınamadı.');
        }
      }

      // iPadOS sensör iznini yalnızca kullanıcı etkileşimi içinde verebiliyor.
      document.addEventListener('pointerdown', enableSensors, { once: true, passive: true });

      // İlk karede birkaç tane üretip ekranda hemen görünmelerini sağla
      for (let i = 0; i < 10; i++) setTimeout(spawnEmoji, i * 60);
      
      // Sayfa görünürlüğüne göre üretimi duraklat (performans)
      document.addEventListener('visibilitychange', () => {
        isPageVisible = !document.hidden;
      });

      // (Gezinme kaldırıldı)
    </script>
    
    <script>
      // Gün sayacı: 08/06/2025 23:37:00 (MM/DD/YYYY → 6 Ağustos 2025) tarihinden beri geçen tam gün
      (function(){
        // 8/6/2025 11:37:00 PM → 6 Ağustos 2025 23:37:00 (Ay 0-indexli: 7 = Ağustos)
        const start = new Date(2025, 7, 6, 23, 37, 0);
        const el = document.getElementById('day-counter');
        function updateDayCounter(){
          const now = new Date();
          const diffMs = now.getTime() - start.getTime();
          const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
          el.textContent = String(Math.max(0, days));
        }
        updateDayCounter();
        setInterval(updateDayCounter, 60 * 1000);
      })();
      
      // Geri sayaç: Unix timestamp 1758253977'den geriye sayan sayaç
      (function(){
        const countdownEl = document.getElementById('countdown');
        if (!countdownEl) return;
        const targetTimestamp = 1758253977; // Hedef Unix timestamp
        
        function updateCountdown(){
          const now = Math.floor(Date.now() / 1000); // Şu anki Unix timestamp
          const secondsLeft = Math.max(0, targetTimestamp - now);
          
          countdownEl.textContent = String(secondsLeft);
        }
        
        updateCountdown();
        setInterval(updateCountdown, 1000);
      })();

      // Arka planı ziyaretçinin yerel saatine göre yumuşakça değiştir.
      (function(){
        const themeColor = document.querySelector('meta[name="theme-color"]');
        const ambientLayer = document.getElementById('ambient-layer');
        const reduceAmbientMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        let currentPeriod = '';
        const themes = {
          morning:   { bg: '#f4c7b4', bg2: '#efd9b6', dot: '#c94f6d', text: '#4a1825', shadow: 'rgba(155, 55, 83, 0.18)' },
          afternoon: { bg: '#e9a4bd', bg2: '#e3c5a1', dot: '#c2185b', text: '#3b0d1a', shadow: 'rgba(194, 24, 91, 0.18)' },
          evening:   { bg: '#d596ae', bg2: '#cfa998', dot: '#a31350', text: '#35101d', shadow: 'rgba(115, 24, 61, 0.22)' },
          night:     { bg: '#75647f', bg2: '#a77e8b', dot: '#ffc0d5', text: '#fff0f5', shadow: 'rgba(39, 16, 48, 0.28)' }
        };

        function random(min, max){
          return Math.random() * (max - min) + min;
        }

        function renderAmbient(period){
          ambientLayer.replaceChildren();

          if (period === 'night') {
            const amount = reduceAmbientMotion ? 18 : 34;
            const symbols = ['✦', '·', '✧'];
            for (let i = 0; i < amount; i++) {
              const star = document.createElement('span');
              star.className = 'ambient-star';
              star.textContent = symbols[Math.floor(Math.random() * symbols.length)];
              star.style.left = random(2, 98) + '%';
              star.style.top = random(2, 96) + '%';
              star.style.fontSize = random(7, 16) + 'px';
              star.style.setProperty('--ambient-duration', random(2.8, 6.5) + 's');
              star.style.animationDelay = -random(0, 6) + 's';
              ambientLayer.appendChild(star);
            }
          } else if (period === 'morning' || period === 'afternoon') {
            const amount = reduceAmbientMotion ? 8 : 16;
            for (let i = 0; i < amount; i++) {
              const mote = document.createElement('span');
              const size = random(4, 12);
              mote.className = 'light-mote';
              mote.style.left = random(1, 99) + '%';
              mote.style.top = random(2, 96) + '%';
              mote.style.setProperty('--mote-size', size + 'px');
              mote.style.setProperty('--mote-x', random(-24, 24) + 'px');
              mote.style.setProperty('--mote-y', random(-42, -16) + 'px');
              mote.style.setProperty('--ambient-duration', random(5, 10) + 's');
              mote.style.animationDelay = -random(0, 10) + 's';
              ambientLayer.appendChild(mote);
            }
          }
        }

        function updateTimeTheme(){
          const hour = new Date().getHours();
          const period = hour >= 6 && hour < 11
            ? 'morning'
            : hour >= 11 && hour < 17
              ? 'afternoon'
              : hour >= 17 && hour < 21
                ? 'evening'
                : 'night';
          const theme = themes[period];
          const root = document.documentElement;

          root.style.setProperty('--bg', theme.bg);
          root.style.setProperty('--bg2', theme.bg2);
          root.style.setProperty('--dot', theme.dot);
          root.style.setProperty('--text', theme.text);
          root.style.setProperty('--shadow', theme.shadow);
          if (themeColor) themeColor.setAttribute('content', theme.bg);
          if (period !== currentPeriod) {
            currentPeriod = period;
            renderAmbient(period);
          }
        }

        updateTimeTheme();
        setInterval(updateTimeTheme, 5 * 60 * 1000);
      })();
    </script>

  </body>
  </html>
