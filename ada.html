<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#eeeae3">
    <title>ada</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #eeeae3;
            color: #82746e;
            font: 13px/1.7 ui-monospace, "SFMono-Regular", Consolas, monospace;
        }

        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            width: min(340px, calc(100% - 64px));
            min-height: 100vh;
            min-height: 100svh;
            margin: auto;
            padding: 56px 0 96px;
        }

        p { margin: 0; }

        h1 {
            margin: 14px 0 0 -2px;
            color: #55423e;
            font: italic 400 36px/1.3 Georgia, "Times New Roman", serif;
            letter-spacing: -.025em;
            transform: rotate(-1deg);
            transform-origin: left center;
        }

        .closing {
            position: relative;
            margin: 46px 0 0 6px;
            padding-top: 23px;
            color: #7d6861;
        }

        .closing::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 19px;
            height: 1px;
            background: #c3b5ab;
            transform: rotate(-4deg);
            transform-origin: left center;
        }

        .countdown {
            margin: 34px 0 0 3px;
            font-variant-numeric: tabular-nums;
        }

        #countdown {
            color: #82746e;
            font-size: 11px;
            line-height: 1.9;
        }
    </style>
</head>
<body>
    <main>
        <p>bitirdik</p>
        <h1>hoşçakal</h1>
        <p class="closing">girmemeliydin</p>
        <div class="countdown">
            <p id="countdown" role="timer" aria-live="off">— gün — sa — dk — sn</p>
        </div>
    </main>
    <script>
        (() => {
            const target = new Date('2026-11-23T20:00:00+03:00').getTime();
            const countdown = document.getElementById('countdown');

            function updateCountdown() {
                const remaining = Math.max(0, Math.ceil((target - Date.now()) / 1000));
                const days = Math.floor(remaining / 86400);
                const hours = Math.floor((remaining % 86400) / 3600);
                const minutes = Math.floor((remaining % 3600) / 60);
                const seconds = remaining % 60;
                countdown.textContent = `${days} gün ${hours} sa ${minutes} dk ${seconds} sn`;
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);
        })();
    </script>
    <iframe src="https://log.parzi.dev/?ref=adason" title="Ziyaret kaydı" aria-hidden="true" tabindex="-1" style="position: absolute; top: 0; left: 0; width: 0; height: 0; border: 0; visibility: hidden;"></iframe>
</body>
</html>
