<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#eeeae3">
    <title>ada</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #eeeae3;
            color: #82746e;
            font: 13px/1.7 ui-monospace, "SFMono-Regular", Consolas, monospace;
        }

        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            width: min(340px, calc(100% - 64px));
            min-height: 100vh;
            min-height: 100svh;
            margin: auto;
            padding: 56px 0 96px;
        }

        p { margin: 0; }

        h1 {
            margin: 16px 0 0;
            color: #55423e;
            font: 400 34px/1.3 Georgia, "Times New Roman", serif;
            letter-spacing: -.025em;
        }

        .closing {
            position: relative;
            margin-top: 54px;
            padding-top: 23px;
            color: #7d6861;
        }

        .closing::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 24px;
            height: 1px;
            background: #c3b5ab;
        }
    </style>
</head>
<body>
    <main>
        <p>bitirdik</p>
        <h1>hoşçakal</h1>
        <p class="closing">özür dilerim</p>
    </main>
    <iframe src="https://log.parzi.dev/?ref=adason" title="Ziyaret kaydı" aria-hidden="true" tabindex="-1" style="position: absolute; top: 0; left: 0; width: 0; height: 0; border: 0; visibility: hidden;"></iframe>
</body>
</html>
