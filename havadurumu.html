<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hava Durumu</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            height: 100vh;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin: 20px 0 10px 0;
            color: white;
            text-align: center;
        }

        .location {
            font-size: clamp(1rem, 4vw, 1.2rem);
            margin-bottom: 20px;
            color: #ccc;
            text-align: center;
        }

        .weather-card {
            width: min(95%, 400px);
            min-height: 450px;
            height: auto;
            background: linear-gradient(to bottom, #252b59, #1e2142);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px;
            box-sizing: border-box;
            margin: 0;
        }

        .weather-title {
            font-size: clamp(1.8rem, 7vw, 32px);
            font-weight: bold;
            text-align: left;
            margin-top: 10px;
            z-index: 10;
        }

        .temperature {
            font-size: clamp(3rem, 10vw, 80px);
            font-weight: bold;
            margin-top: auto;
            margin-bottom: 10px;
            z-index: 10;
        }

        .details {
            font-size: clamp(0.9rem, 4vw, 16px);
            opacity: 0.8;
            margin-bottom: 8px;
            z-index: 10;
        }

        .details-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .last-updated {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 20px;
            text-align: center;
        }

        .cards-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 900px;
        }

        .city-name {
            font-size: clamp(1rem, 4vw, 1.2rem);
            margin-bottom: 10px;
            color: #ccc;
            text-align: center;
            font-weight: bold;
        }

        /* Güneş Animasyonu */
        .sun {
            width: 100px;
            height: 100px;
            background: #FFD700;
            border-radius: 50%;
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 30px #FFD700;
        }

        .sunny-bg {
            background: linear-gradient(to bottom, #4a5bcc, #2e3a87);
        }

        .clear-bg {
            background: linear-gradient(to bottom, #2e3a87, #1e2142);
        }

        /* Bulut Stili */
        .cloud-container {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 80px;
        }

        .cloud {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
            position: absolute;
        }

        .cloud-base {
            width: 120px;
            height: 40px;
            bottom: 0;
            left: 30px;
        }

        .cloud-circle-1 {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            bottom: 10px;
            left: 30px;
        }

        .cloud-circle-2 {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            bottom: 5px;
            left: 65px;
        }

        .cloud-circle-3 {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            bottom: 10px;
            left: 110px;
        }

        /* Yağmur Animasyonu */
        .rain {
            position: absolute;
            width: 2px;
            height: 20px;
            background: #4a95ff;
        }

        /* Kar Animasyonu */
        .snow {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
        }

        /* Rüzgar Animasyonu */
        .wind-line {
            position: absolute;
            height: 2px;
            background: rgba(255, 255, 255, 0.5);
        }

        /* Kar zemini */
        .snow-ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: white;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }

        .refresh-btn {
            padding: 12px 24px;
            background: #3a3f6d;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: clamp(0.9rem, 4vw, 16px);
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
            width: min(90%, 200px);
            -webkit-tap-highlight-color: transparent;
        }

        .refresh-btn:hover {
            background: #4a5095;
        }

        .loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 15px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
            }

            .weather-card {
                padding: 20px;
                height: auto;
                margin: 10px;
            }

            .cloud-container {
                transform: scale(0.8) translateX(-60%);
            }

            .sun {
                transform: scale(0.8) translateX(-60%);
            }

            .details-container {
                gap: 3px;
            }

            .last-updated {
                font-size: 11px;
                margin-top: 15px;
            }

            .refresh-btn {
                width: 100%;
                padding: 15px;
                font-size: clamp(1rem, 5vw, 18px);
            }

            .temperature {
                font-size: clamp(3rem, 10vw, 80px);
            }

            .details {
                font-size: clamp(1rem, 5vw, 18px);
            }
        }

        @media (max-height: 600px) {
            body {
                justify-content: flex-start;
                padding-top: 10px;
            }

            h1 {
                margin-top: 10px;
            }

            .weather-card {
                min-height: 320px;
            }
        }

        /* Night Mode Styles */
        .night-bg {
            background: linear-gradient(to bottom, #0c0c1a, #000000);
        }

        .moon {
            width: 80px;
            height: 80px;
            background: #f0f8ff;
            border-radius: 50%;
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 30px #b0e0e6, 0 0 50px #add8e6;
        }

        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* Night adaptations for other elements */
        .cloud.night {
            background: rgba(220, 220, 240, 0.5);
        }

        .cloud.night::before,
        .cloud.night::after {
            background: rgba(220, 220, 240, 0.5);
        }

        .rain.night {
            background: rgba(135, 206, 250, 0.8);
        }

        .snow.night {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 4px rgba(173, 216, 230, 0.5);
        }

        .wind-line.night {
            background: rgba(220, 220, 240, 0.6);
        }
    </style>
</head>

<body>
    <h1>Hava Durumu</h1>

    <div class="cards-container">
        <div>
            <div class="city-name">Ada Ev</div>
            <div class="weather-card" id="weather-card1">
                <div class="loading" id="loading1">
                    <div class="spinner"></div>
                </div>
                <div class="weather-title" id="weather-condition1">Yükleniyor...</div>
                <div class="temperature" id="temperature1">--°C</div>
                <div class="details-container">
                    <div class="details" id="feels-like1">Hissedilen: --°C</div>
                    <div class="details" id="humidity1">Nem: --%</div>
                    <div class="details" id="wind1">Rüzgar: -- m/s</div>
                </div>
                <div class="last-updated" id="last-updated1">Son güncelleme: --:--</div>
            </div>
        </div>

        <div>
            <div class="city-name">Parzi Ev</div>
            <div class="weather-card" id="weather-card2">
                <div class="loading" id="loading2">
                    <div class="spinner"></div>
                </div>
                <div class="weather-title" id="weather-condition2">Yükleniyor...</div>
                <div class="temperature" id="temperature2">--°C</div>
                <div class="details-container">
                    <div class="details" id="feels-like2">Hissedilen: --°C</div>
                    <div class="details" id="humidity2">Nem: --%</div>
                    <div class="details" id="wind2">Rüzgar: -- m/s</div>
                </div>
                <div class="last-updated" id="last-updated2">Son güncelleme: --:--</div>
            </div>
        </div>
    </div>

    <button class="refresh-btn" id="refresh-btn" style="margin-top: 20px;">Yenile</button>

    <script>
        const apiKey = 'bc9ee4dc966affd2c33c7358511d1510';
        const cities = ['Gazimağusa', 'Lüleburgaz'];

        // State objects for animations
        let card1State = { animationsRunning: false, rainInterval: null, snowInterval: null, windInterval: null, thunderInterval: null, isNight: false };
        let card2State = { animationsRunning: false, rainInterval: null, snowInterval: null, windInterval: null, thunderInterval: null, isNight: false };

        // DOM elemanları for card 1
        const weatherCard1 = document.getElementById('weather-card1');
        const weatherCondition1 = document.getElementById('weather-condition1');
        const temperatureElement1 = document.getElementById('temperature1');
        const feelsLikeElement1 = document.getElementById('feels-like1');
        const humidityElement1 = document.getElementById('humidity1');
        const windElement1 = document.getElementById('wind1');
        const lastUpdatedElement1 = document.getElementById('last-updated1');
        const loadingElement1 = document.getElementById('loading1');

        // DOM elemanları for card 2
        const weatherCard2 = document.getElementById('weather-card2');
        const weatherCondition2 = document.getElementById('weather-condition2');
        const temperatureElement2 = document.getElementById('temperature2');
        const feelsLikeElement2 = document.getElementById('feels-like2');
        const humidityElement2 = document.getElementById('humidity2');
        const windElement2 = document.getElementById('wind2');
        const lastUpdatedElement2 = document.getElementById('last-updated2');
        const loadingElement2 = document.getElementById('loading2');

        const refreshBtn = document.getElementById('refresh-btn');

        // Hava durumu verilerini getir (parametreli)
        async function getWeatherData(city, loadingEl, updateCallback) {
            loadingEl.style.display = 'flex';

            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric&lang=tr`);
                const data = await response.json();

                if (response.ok && data.cod === 200) {
                    updateCallback(data);
                } else {
                    console.error('Hava durumu verileri alınamadı: ' + (data.message || 'Bilinmeyen hata'));
                }
            } catch (error) {
                console.error('Hava durumu verileri alınamadı: ' + error.message);
            } finally {
                loadingEl.style.display = 'none';
            }
        }

        // UI'ı güncelle (parametreli)
        function updateWeatherUI(data, cardEl, conditionEl, tempEl, feelsEl, humEl, windEl, updatedEl, state) {
            const temp = Math.round(data.main.temp);
            const feelsLike = Math.round(data.main.feels_like);
            const humidity = data.main.humidity;
            const windSpeedMs = data.wind.speed.toFixed(1);

            // UI güncelleme
            tempEl.textContent = `${temp}°C`;
            feelsEl.textContent = `Hissedilen: ${feelsLike}°C`;
            humEl.textContent = `Nem: ${humidity}%`;
            windEl.textContent = `Rüzgar: ${windSpeedMs} m/s`;

            let weatherDesc = data.weather[0].description;
            let turkishWeather = weatherDesc.charAt(0).toUpperCase() + weatherDesc.slice(1);
            conditionEl.textContent = turkishWeather;

            // weatherMain belirle
            let weatherMain = data.weather[0].main;
            if (weatherMain === 'Drizzle') {
                weatherMain = 'Rain';
            }

            // Gece/gündüz hesaplama
            const sunriseDate = new Date(data.sys.sunrise * 1000);
            const sunsetDate = new Date(data.sys.sunset * 1000);
            const sunriseMin = sunriseDate.getHours() * 60 + sunriseDate.getMinutes();
            const sunsetMin = sunsetDate.getHours() * 60 + sunsetDate.getMinutes();
            const now = new Date();
            const nowMin = now.getHours() * 60 + now.getMinutes();
            const isNight = nowMin >= sunsetMin || nowMin <= sunriseMin;
            state.isNight = isNight;

            // Son güncelleme zamanı
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            updatedEl.textContent = `Son güncelleme: ${hours}:${minutes}`;

            // Mevcut animasyonları temizle
            clearAnimations(cardEl, state);

            // Arka plan ve animasyonları ayarla
            setupWeatherAnimation(cardEl, weatherMain, state, isNight);
        }

        // Get weather for card 1
        function getWeatherForCard1() {
            getWeatherData(cities[0], loadingElement1, (data) => updateWeatherUI(data, weatherCard1, weatherCondition1, temperatureElement1, feelsLikeElement1, humidityElement1, windElement1, lastUpdatedElement1, card1State));
        }

        // Get weather for card 2
        function getWeatherForCard2() {
            getWeatherData(cities[1], loadingElement2, (data) => updateWeatherUI(data, weatherCard2, weatherCondition2, temperatureElement2, feelsLikeElement2, humidityElement2, windElement2, lastUpdatedElement2, card2State));
        }

        // Animasyonları temizle (parametreli)
        function clearAnimations(cardEl, state) {
            if (state.animationsRunning) {
                if (state.rainInterval) clearInterval(state.rainInterval);
                if (state.snowInterval) clearInterval(state.snowInterval);
                if (state.windInterval) clearInterval(state.windInterval);
                if (state.thunderInterval) clearInterval(state.thunderInterval);
                state.animationsRunning = false;
            }

            // Mevcut animasyon elemanlarını temizle (card specific)
            cardEl.querySelectorAll('.rain, .snow, .wind-line, .sun, .cloud-container, .moon, .stars-container, .snow-ground').forEach(el => el.remove());

            // Arka plan sınıflarını temizle
            cardEl.classList.remove('sunny-bg', 'clear-bg', 'night-bg');
        }

        // Hava durumuna göre animasyon ayarla (parametreli)
        function setupWeatherAnimation(cardEl, weatherMain, state, isNight) {
            switch (weatherMain) {
                case 'Clear':
                    setupClearAnimation(cardEl, isNight);
                    break;
                case 'Clouds':
                    setupCloudyAnimation(cardEl, state, isNight);
                    break;
                case 'Rain':
                    setupRainyAnimation(cardEl, state, isNight);
                    break;
                case 'Snow':
                    setupSnowyAnimation(cardEl, state, isNight);
                    break;
                case 'Thunderstorm':
                    setupThunderstormAnimation(cardEl, state, isNight);
                    break;
                default:
                    // Varsayılan olarak bulutlu göster
                    setupCloudyAnimation(cardEl, state, isNight);
            }
        }

        // Clear animasyon (güneş veya ay)
        function setupClearAnimation(cardEl, isNight) {
            if (isNight) {
                cardEl.classList.add('night-bg');

                const moon = document.createElement('div');
                moon.classList.add('moon');
                cardEl.appendChild(moon);

                const starsContainer = document.createElement('div');
                starsContainer.classList.add('stars-container');
                cardEl.appendChild(starsContainer);

                for (let i = 0; i < 20; i++) {
                    const star = document.createElement('div');
                    star.classList.add('star');
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 60 + '%';
                    star.style.animationDelay = Math.random() * 2 + 's';
                    starsContainer.appendChild(star);
                }
            } else {
                cardEl.classList.add('sunny-bg');

                const sun = document.createElement('div');
                sun.classList.add('sun');
                cardEl.appendChild(sun);
            }
        }

        // Bulutlu animasyon (parametreli)
        function setupCloudyAnimation(cardEl, state, isNight) {
            if (isNight) {
                cardEl.classList.add('night-bg');
            }

            const cloudContainer = document.createElement('div');
            cloudContainer.classList.add('cloud-container');

            const cloudBase = document.createElement('div');
            cloudBase.classList.add('cloud', 'cloud-base');
            if (isNight) cloudBase.classList.add('night');

            const cloudCircle1 = document.createElement('div');
            cloudCircle1.classList.add('cloud', 'cloud-circle-1');
            if (isNight) cloudCircle1.classList.add('night');

            const cloudCircle2 = document.createElement('div');
            cloudCircle2.classList.add('cloud', 'cloud-circle-2');
            if (isNight) cloudCircle2.classList.add('night');

            const cloudCircle3 = document.createElement('div');
            cloudCircle3.classList.add('cloud', 'cloud-circle-3');
            if (isNight) cloudCircle3.classList.add('night');

            cloudContainer.appendChild(cloudBase);
            cloudContainer.appendChild(cloudCircle1);
            cloudContainer.appendChild(cloudCircle2);
            cloudContainer.appendChild(cloudCircle3);

            cardEl.appendChild(cloudContainer);

            // Hafif rüzgar efekti
            state.animationsRunning = true;
            state.windInterval = setInterval(() => createLightWind(cardEl, state), 1000);
        }

        // Yağmurlu animasyon (parametreli)
        function setupRainyAnimation(cardEl, state, isNight) {
            // Önce bulutları ekle
            setupCloudyAnimation(cardEl, state, isNight);

            // Yağmur animasyonu
            state.animationsRunning = true;
            state.rainInterval = setInterval(() => createRain(cardEl, state), 200);
        }

        // Karlı animasyon (parametreli)
        function setupSnowyAnimation(cardEl, state, isNight) {
            // Önce bulutları ekle
            setupCloudyAnimation(cardEl, state, isNight);

            // Kar zemini ekle
            const snowGround = document.createElement('div');
            snowGround.classList.add('snow-ground');
            cardEl.appendChild(snowGround);

            // Kar animasyonu
            state.animationsRunning = true;
            state.snowInterval = setInterval(() => createSnow(cardEl, state), 300);
        }

        // Fırtınalı animasyon (parametreli)
        function setupThunderstormAnimation(cardEl, state, isNight) {
            // Önce yağmurlu animasyonu ekle
            setupRainyAnimation(cardEl, state, isNight);

            // Şimşek efekti ekle
            function createLightning() {
                cardEl.style.backgroundColor = 'rgba(255, 255, 255, 0.3)';
                setTimeout(() => {
                    cardEl.style.backgroundColor = '';
                }, 100);
            }

            // Rastgele şimşek çak
            state.thunderInterval = setInterval(createLightning, 3000 + Math.random() * 5000);
        }

        // Yağmur damlası oluştur (parametreli)
        function createRain(cardEl, state) {
            const drop = document.createElement('div');
            drop.classList.add('rain');
            if (state.isNight) drop.classList.add('night');
            drop.style.left = Math.random() * 340 + 20 + 'px';
            drop.style.top = '120px';
            cardEl.appendChild(drop);

            let position = 120;
            const fall = setInterval(() => {
                position += 5;
                drop.style.top = position + 'px';

                if (position > 450) {
                    clearInterval(fall);
                    drop.remove();
                }
            }, 20);
        }

        // Kar tanesi oluştur (parametreli)
        function createSnow(cardEl, state) {
            const flake = document.createElement('div');
            flake.classList.add('snow');
            if (state.isNight) flake.classList.add('night');
            flake.style.left = Math.random() * 340 + 20 + 'px';
            flake.style.top = '120px';
            cardEl.appendChild(flake);

            let position = 120;
            let offset = Math.random() * 4 - 2;
            let horizontalPos = parseFloat(flake.style.left);

            const fall = setInterval(() => {
                position += 2;
                horizontalPos += offset;
                flake.style.top = position + 'px';
                flake.style.left = horizontalPos + 'px';

                if (position > 400) {
                    clearInterval(fall);
                    flake.remove();
                }
            }, 50);
        }

        // Hafif rüzgar çizgisi oluştur (parametreli)
        function createLightWind(cardEl, state) {
            const line = document.createElement('div');
            line.classList.add('wind-line');
            if (state.isNight) line.classList.add('night');

            const yPos = Math.random() * 200 + 80;
            line.style.top = yPos + 'px';
            line.style.left = '20px';
            line.style.width = '0px';

            cardEl.appendChild(line);

            let width = 0;
            const grow = setInterval(() => {
                width += 4;
                line.style.width = width + 'px';

                if (width > 120) {
                    clearInterval(grow);
                    setTimeout(() => line.remove(), 100);
                }
            }, 30);
        }

        // Sayfa yüklendiğinde hava durumunu getir
        window.addEventListener('load', () => {
            getWeatherForCard1();
            getWeatherForCard2();
        });

        // Yenile düğmesi her iki kart için de yenile
        refreshBtn.addEventListener('click', () => {
            getWeatherForCard1();
            getWeatherForCard2();
        });

        // Otomatik yenileme her iki kart için (5 dakikada bir)
        setInterval(() => {
            getWeatherForCard1();
            getWeatherForCard2();
        }, 5 * 60 * 1000);
    </script>
</body>

</html>
