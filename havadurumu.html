<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hava Durumu</title>
    <!-- Modern web fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons for clean SVGs -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-base: #000000;
            --bg-card: rgba(20, 20, 22, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent: #ededed;
            --accent-bg: #111111;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Abstract Glow Background typically found in Next.js brand sites */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 100vh;
            background:
                radial-gradient(circle at 15% 30%, rgba(56, 189, 248, 0.06), transparent 25%),
                radial-gradient(circle at 85% 60%, rgba(168, 85, 247, 0.05), transparent 25%),
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.03), transparent 40%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 3rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            animation: fadeDown 0.6s ease-out;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: linear-gradient(to right, #ffffff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .refresh-btn {
            background-color: var(--text-primary);
            color: var(--bg-base);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
        }

        .refresh-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(255, 255, 255, 0.15);
            background-color: #f4f4f5;
        }

        .refresh-btn:active {
            transform: translateY(1px);
        }

        .spin-anim {
            animation: spin 1s linear infinite;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            animation: fadeUp 0.6s ease-out 0.2s both;
        }

        .weather-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            position: relative;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow: hidden;
        }

        /* Ambient glow effect inside card */
        .weather-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0%, transparent 100%);
            pointer-events: none;
        }

        .weather-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 1;
        }

        .city-name {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: var(--text-primary);
        }

        .weather-desc {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-transform: capitalize;
            margin-top: 0.4rem;
        }

        .weather-icon-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .temperature {
            display: flex;
            align-items: flex-start;
            font-size: 6rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 1;
            margin: 1.5rem 0;
            color: var(--text-primary);
            z-index: 1;
        }

        .deg-symbol {
            font-size: 3.5rem;
            font-weight: 400;
            margin-top: 0.2rem;
            color: var(--text-secondary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            z-index: 1;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .stat-label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-value {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .last-updated {
            position: absolute;
            bottom: 1.5rem;
            right: 1.5rem;
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-weight: 400;
            z-index: 1;
        }

        /* Loading Skeleton Animation */
        .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.03) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.03) 75%);
            background-size: 200% 100%;
            animation: skeletonLoading 1.5s infinite;
            border-radius: 6px;
        }

        .skeleton-text {
            height: 1rem;
            width: 60%;
            margin-top: 0.4rem;
        }

        .skeleton-temp {
            height: 4.5rem;
            width: 50%;
            margin: 1.5rem 0;
            border-radius: 12px;
        }

        .skeleton-icon {
            height: 48px;
            width: 48px;
            border-radius: 50%;
        }

        @keyframes skeletonLoading {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .float-anim {
            animation: float 4s ease-in-out infinite;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .container {
                padding: 2rem 1rem;
                gap: 1.5rem;
            }

            .weather-card {
                padding: 1.5rem;
            }

            header {
                padding-bottom: 1rem;
            }

            .temperature {
                font-size: 4.5rem;
                margin: 1rem 0;
            }

            .deg-symbol {
                font-size: 2.5rem;
            }
        }

        /* Icon styling */
        .lucide {
            stroke-width: 2;
        }

        .icon-sun {
            color: #facc15;
        }

        .icon-moon {
            color: #e2e8f0;
        }

        .icon-cloud {
            color: #94a3b8;
        }

        .icon-rain {
            color: #60a5fa;
        }

        .icon-snow {
            color: #bae6fd;
        }

        .icon-lightning {
            color: #facc15;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>
                <i data-lucide="cloud-sun" style="width: 24px; height: 24px; color: #facc15;"></i>
                Hava Durumu
            </h1>
            <button class="refresh-btn" id="refresh-btn">
                <i data-lucide="refresh-cw" id="refresh-icon" style="width: 14px; height: 14px;"></i>
                Yenile
            </button>
        </header>

        <div class="cards-grid">
            <!-- Ada Ev Kartı -->
            <div class="weather-card" id="card-ada">
                <div class="card-header">
                    <div>
                        <h2 class="city-name">Ada Ev</h2>
                        <div class="weather-desc" id="desc-ada">
                            <div class="skeleton skeleton-text" style="width: 80px;"></div>
                        </div>
                    </div>
                    <div class="weather-icon-container float-anim" id="icon-ada">
                        <div class="skeleton skeleton-icon"></div>
                    </div>
                </div>

                <div id="temp-ada" class="temperature">
                    <div class="skeleton skeleton-temp"></div>
                </div>

                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label"><i data-lucide="thermometer" style="width: 14px; height: 14px;"></i>
                            Hissedilen</span>
                        <span class="stat-value" id="feels-ada">
                            <div class="skeleton skeleton-text" style="height: 0.95rem; width: 40px; margin-top: 0">
                            </div>
                        </span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label"><i data-lucide="droplets" style="width: 14px; height: 14px;"></i>
                            Nem</span>
                        <span class="stat-value" id="hum-ada">
                            <div class="skeleton skeleton-text" style="height: 0.95rem; width: 40px; margin-top: 0">
                            </div>
                        </span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label"><i data-lucide="wind" style="width: 14px; height: 14px;"></i>
                            Rüzgar</span>
                        <span class="stat-value" id="wind-ada">
                            <div class="skeleton skeleton-text" style="height: 0.95rem; width: 60px; margin-top: 0">
                            </div>
                        </span>
                    </div>
                </div>
                <div class="last-updated" id="time-ada"></div>
            </div>

            <!-- Parzi Ev Kartı -->
            <div class="weather-card" id="card-parzi">
                <div class="card-header">
                    <div>
                        <h2 class="city-name">Parzi Ev</h2>
                        <div class="weather-desc" id="desc-parzi">
                            <div class="skeleton skeleton-text" style="width: 80px;"></div>
                        </div>
                    </div>
                    <div class="weather-icon-container float-anim" id="icon-parzi">
                        <div class="skeleton skeleton-icon"></div>
                    </div>
                </div>

                <div id="temp-parzi" class="temperature">
                    <div class="skeleton skeleton-temp"></div>
                </div>

                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label"><i data-lucide="thermometer" style="width: 14px; height: 14px;"></i>
                            Hissedilen</span>
                        <span class="stat-value" id="feels-parzi">
                            <div class="skeleton skeleton-text" style="height: 0.95rem; width: 40px; margin-top: 0">
                            </div>
                        </span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label"><i data-lucide="droplets" style="width: 14px; height: 14px;"></i>
                            Nem</span>
                        <span class="stat-value" id="hum-parzi">
                            <div class="skeleton skeleton-text" style="height: 0.95rem; width: 40px; margin-top: 0">
                            </div>
                        </span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label"><i data-lucide="wind" style="width: 14px; height: 14px;"></i>
                            Rüzgar</span>
                        <span class="stat-value" id="wind-parzi">
                            <div class="skeleton skeleton-text" style="height: 0.95rem; width: 60px; margin-top: 0">
                            </div>
                        </span>
                    </div>
                </div>
                <div class="last-updated" id="time-parzi"></div>
            </div>
        </div>
    </div>

    <script>
        // Init icons generally
        lucide.createIcons();

        const API_KEY = 'bc9ee4dc966affd2c33c7358511d1510';
        const CITIES = [
            { id: 'ada', name: 'Gazimağusa' },
            { id: 'ada', name: 'Gazimağusa' },
            { id: 'ada', name: 'Gazimağusa' },
            { id: 'parzi', name: 'Lüleburgaz' }
        ];

        function getIconConfig(main, isNight) {
            main = main.toLowerCase();
            if (main.includes('clear')) return { name: isNight ? 'moon' : 'sun', class: isNight ? 'icon-moon' : 'icon-sun' };
            if (main.includes('cloud')) return { name: 'cloud', class: 'icon-cloud' };
            if (main.includes('rain') || main.includes('drizzle')) return { name: 'cloud-rain', class: 'icon-rain' };
            if (main.includes('snow')) return { name: 'snowflake', class: 'icon-snow' };
            if (main.includes('thunder')) return { name: 'cloud-lightning', class: 'icon-lightning' };
            return { name: 'cloud', class: 'icon-cloud' }; // default
        }

        async function fetchWeather(cityObj) {
            try {
                const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(cityObj.name)}&appid=${API_KEY}&units=metric&lang=tr`;
                const response = await fetch(url);
                const data = await response.json();

                if (response.ok && data.cod === 200) {
                    updateCardUI(cityObj.id, data);
                } else {
                    console.error('API Error:', data.message);
                    setCardError(cityObj.id);
                }
            } catch (error) {
                console.error('Fetch Error:', error);
                setCardError(cityObj.id);
            }
        }

        function updateCardUI(id, data) {
            const temp = Math.round(data.main.temp);
            const feels = Math.round(data.main.feels_like);
            const hum = data.main.humidity;
            const wind = data.wind.speed.toFixed(1);
            let desc = data.weather[0].description;
            let main = data.weather[0].main;

            const nowUnix = Math.floor(Date.now() / 1000);
            const isNight = nowUnix < data.sys.sunrise || nowUnix > data.sys.sunset;

            document.getElementById(`desc-${id}`).textContent = desc;
            document.getElementById(`temp-${id}`).innerHTML = `${temp}<span class="deg-symbol">°</span>`;
            document.getElementById(`feels-${id}`).textContent = `${feels}°`;
            document.getElementById(`hum-${id}`).textContent = `${hum}%`;
            document.getElementById(`wind-${id}`).textContent = `${wind} km/s`;

            const timeStr = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
            document.getElementById(`time-${id}`).textContent = `${timeStr}`;

            const iconConfig = getIconConfig(main, isNight);
            const iconContainer = document.getElementById(`icon-${id}`);
            iconContainer.innerHTML = `<i data-lucide="${iconConfig.name}" class="${iconConfig.class}" style="width: 48px; height: 48px; stroke-width: 1.5px;"></i>`;

            lucide.createIcons({ root: iconContainer });
        }

        function setCardError(id) {
            document.getElementById(`desc-${id}`).textContent = 'Bağlantı Hatası';
            document.getElementById(`temp-${id}`).innerHTML = `--<span class="deg-symbol">°</span>`;
            document.getElementById(`feels-${id}`).textContent = `--°`;
            document.getElementById(`hum-${id}`).textContent = `--%`;
            document.getElementById(`wind-${id}`).textContent = `--`;
        }

        async function refreshAll() {
            const btnIcon = document.getElementById('refresh-icon');
            btnIcon.classList.add('spin-anim');

            // Re-render skeletons
            CITIES.forEach(c => {
                document.getElementById(`desc-${c.id}`).innerHTML = `<div class="skeleton skeleton-text" style="width: 80px;"></div>`;
                document.getElementById(`temp-${c.id}`).innerHTML = `<div class="skeleton skeleton-temp"></div>`;
                document.getElementById(`icon-${c.id}`).innerHTML = `<div class="skeleton skeleton-icon"></div>`;
                document.getElementById(`feels-${c.id}`).innerHTML = `<div class="skeleton skeleton-text" style="height: 0.95rem; width: 40px; margin-top: 0"></div>`;
                document.getElementById(`hum-${c.id}`).innerHTML = `<div class="skeleton skeleton-text" style="height: 0.95rem; width: 40px; margin-top: 0"></div>`;
                document.getElementById(`wind-${c.id}`).innerHTML = `<div class="skeleton skeleton-text" style="height: 0.95rem; width: 60px; margin-top: 0"></div>`;
                document.getElementById(`time-${c.id}`).textContent = '';
            });

            await Promise.all(CITIES.map(c => fetchWeather(c)));

            setTimeout(() => {
                btnIcon.classList.remove('spin-anim');
            }, 600); // small delay for smoother animation transition
        }

        document.getElementById('refresh-btn').addEventListener('click', refreshAll);

        // Fetch on load
        window.addEventListener('load', refreshAll);

        // Auto refresh 5 mins
        setInterval(refreshAll, 5 * 60 * 1000);

    </script>
</body>

</html>
