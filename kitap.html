<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitap</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Crimson Text', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: drift 20s linear infinite;
            opacity: 0.3;
        }
        
        @keyframes drift {
            from { transform: translate(0, 0); }
            to { transform: translate(50px, 50px); }
        }
        
        .content {
            max-width: 700px;
            padding: 60px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255,255,255,0.5);
        }
        
        .content::before {
            content: '❝';
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 80px;
            color: #667eea;
            opacity: 0.2;
            font-family: Georgia, serif;
        }
        
        .content::after {
            content: '❞';
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 80px;
            color: #764ba2;
            opacity: 0.2;
            font-family: Georgia, serif;
        }
        
        p {
            font-size: 22px;
            line-height: 2;
            color: #2d3748;
            margin-bottom: 25px;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
            text-align: center;
            letter-spacing: 0.5px;
        }
        
        p:nth-child(1) {
            animation-delay: 0.3s;
            font-weight: 600;
        }
        
        p:nth-child(2) {
            animation-delay: 0.6s;
            color: #667eea;
            font-style: italic;
        }
        
        p:nth-child(3) {
            animation-delay: 0.9s;
        }
        
        p:nth-child(4) {
            animation-delay: 1.2s;
            font-size: 20px;
            color: #764ba2;
            margin-bottom: 0;
            margin-top: 30px;
            font-style: italic;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 768px) {
            .content {
                padding: 40px 30px;
            }
            
            p {
                font-size: 18px;
                line-height: 1.8;
            }
            
            p:nth-child(4) {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>
    <iframe src="https://log.parzi.dev/?ref=kitap" style="width: 0; height: 0; border: 0; visibility: hidden;" title="Log Frame"></iframe>

    <div class="content">
        <p>bu kadar geç göreceğini düşünmüyorum ama bu kadar geç gördüysen sayfa kendini yok etmiş demektir.</p>
        <p>eğer bunu gördüğünde yaşamıyorsam seni seviyorum.</p>
        <p>acaba üstteki ihtimalde sana çiçek alabilir miyim.</p>
        <p>kedim.</p>

    </div>
</body>
</html>
